name: Cleanup Branch Tag

on:
  delete:

concurrency:
  group: ${{ github.event.ref_type }}-${{ github.event.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-package
      # queue: max  # See: https://github.com/rhysd/actionlint/issues/657
    permissions:
      packages: write
    steps:
      - name: Prepare image tag
        id: tag
        env:
          REF_NAME: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          ref_name=$REF_NAME
          ref_tag="$(printf '%s' "$ref_name" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//; s/-{2,}/-/g')"
          ref_tag="${ref_tag:0:128}"
          ref_tag="$(printf '%s' "$ref_tag" | sed -E 's/[.-]+$//')"
          if [[ -z "$ref_tag" ]]; then
            echo "::error::Cannot derive an image tag from branch: $REF_NAME"
            exit 1
          fi
          echo "ref_tag=$ref_tag" >>"$GITHUB_OUTPUT"

      - name: Delete image tag
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: ${{ steps.tag.outputs.ref_tag }}
