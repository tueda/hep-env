name: Build and Publish Image

on:
  push:
  workflow_dispatch:

concurrency:
  group: >-
    ${{
      github.event.deleted
      && format('deleted-push-{0}', github.run_id)
      || format('{0}-{1}', github.ref_type, github.ref_name)
    }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare variables
        id: vars
        run: |
          set -euo pipefail

          # image: lowercased image reference (registry/repository).
          echo "image=$(echo "$REGISTRY/$IMAGE_NAME" \
            | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

          # platform_pair: artifact-safe platform key.
          # Example: linux/amd64 -> linux-amd64
          platform='${{ matrix.platform }}'
          echo "platform_pair=${platform//\//-}" >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.vars.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/digests"
          digest=$DIGEST
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest: $digest"
            exit 1
          fi
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Pull the exact image
        id: exact-image
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          image_ref="$IMAGE@$DIGEST"
          docker pull --platform "$PLATFORM" "$image_ref"
          docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$image_ref" | grep -Fx "$image_ref"
          echo "image_id=$(docker image inspect \
            --format '{{.Id}}' "$image_ref")" >>"$GITHUB_OUTPUT"

      - name: Run Docker physics smoke test
        id: docker-smoke
        env:
          DOCKER_IMAGE: >-
            ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          started_at=$SECONDS
          ./scripts/smoke-test-docker.sh
          echo "seconds=$((SECONDS - started_at))" >>"$GITHUB_OUTPUT"

      - name: Tag the exact image for Apptainer
        id: local-image
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ steps.exact-image.outputs.image_id }}
          PLATFORM_PAIR: ${{ steps.vars.outputs.platform_pair }}
        run: |
          set -euo pipefail

          local_tag="hep-env-smoke:$PLATFORM_PAIR-${GITHUB_SHA::12}"
          docker tag "$IMAGE@$DIGEST" "$local_tag"
          actual_image_id=$(docker image inspect \
            --format '{{.Id}}' "$local_tag")
          if [[ $actual_image_id != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error::Temporary tag does not match the tested image"
            exit 1
          fi
          echo "tag=$local_tag" >>"$GITHUB_OUTPUT"

      - name: Install Apptainer
        id: install-apptainer
        run: |
          set -euo pipefail

          started_at=$SECONDS
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get install -y apptainer
          apptainer_version=$(apptainer --version)
          echo "$apptainer_version"
          {
            echo "version=$apptainer_version"
            echo "seconds=$((SECONDS - started_at))"
          } >>"$GITHUB_OUTPUT"

      - name: Convert the exact image and initialize Apptainer data
        id: sif
        env:
          LOCAL_IMAGE: ${{ steps.local-image.outputs.tag }}
          PLATFORM_PAIR: ${{ steps.vars.outputs.platform_pair }}
        run: |
          set -euo pipefail

          smoke_root="$RUNNER_TEMP/hep-env-smoke-$PLATFORM_PAIR"
          sif_path="$smoke_root/hep-env.sif"
          work_dir="$smoke_root/work"
          data_dir="$smoke_root/data"
          mkdir -p "$smoke_root" "$work_dir"

          started_at=$SECONDS
          apptainer build "$sif_path" "docker-daemon://$LOCAL_IMAGE"
          conversion_seconds=$((SECONDS - started_at))

          apptainer exec \
            --cleanenv \
            --no-home \
            --net --network none \
            --bind "$smoke_root:/work" \
            "$sif_path" \
            cp -r /data /work/data
          touch "$data_dir/.hep-env-initialized"

          {
            echo "sif_path=$sif_path"
            echo "work_dir=$work_dir"
            echo "data_dir=$data_dir"
            echo "seconds=$conversion_seconds"
          } >>"$GITHUB_OUTPUT"

      - name: Run Apptainer physics smoke test
        id: apptainer-smoke
        env:
          WORK_DIR: ${{ steps.sif.outputs.work_dir }}
          APPTAINER_DATA_DIR: ${{ steps.sif.outputs.data_dir }}
          APPTAINER_IMAGE: ${{ steps.sif.outputs.sif_path }}
          SMOKE_KEEP_WORK: 1
        run: |
          set -euo pipefail

          started_at=$SECONDS
          ./scripts/smoke-test-apptainer.sh
          echo "seconds=$((SECONDS - started_at))" >>"$GITHUB_OUTPUT"

      - name: Prepare smoke-test artifact
        id: smoke-artifact-files
        env:
          WORK_DIR: ${{ steps.sif.outputs.work_dir }}
          PLATFORM_PAIR: ${{ steps.vars.outputs.platform_pair }}
        run: |
          set -euo pipefail

          smoke_dir="$WORK_DIR/hep-env-smoke"
          plot_dir="$smoke_dir/ma5-output/Output/HTML/MadAnalysis5job_0"
          histogram_file="$smoke_dir/ma5-output/Output/SAF/_ttbar/"
          histogram_file+="MadAnalysis5job_0/Histograms/histos.saf"
          artifact_dir="$RUNNER_TEMP/smoke-artifact-$PLATFORM_PAIR"
          mkdir -p "$artifact_dir"
          install -m 0644 "$plot_dir/selection_0.png" \
            "$artifact_dir/N-j.png"
          install -m 0644 "$plot_dir/selection_1.png" \
            "$artifact_dir/leading-jet-pt.png"
          install -m 0644 "$plot_dir/selection_2.png" \
            "$artifact_dir/MET.png"
          install -m 0644 "$histogram_file" "$artifact_dir/histos.saf"
          install -m 0644 "$smoke_dir/smoke.log" \
            "$artifact_dir/smoke.log"
          echo "path=$artifact_dir" >>"$GITHUB_OUTPUT"

      - name: Upload smoke-test artifact
        id: upload-smoke-artifact
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ steps.vars.outputs.platform_pair }}
          path: ${{ steps.smoke-artifact-files.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Add smoke-test summary
        env:
          PLATFORM: ${{ matrix.platform }}
          WORK_DIR: ${{ steps.sif.outputs.work_dir }}
          DOCKER_SECONDS: ${{ steps.docker-smoke.outputs.seconds }}
          APPTAINER_INSTALL_SECONDS: >-
            ${{ steps.install-apptainer.outputs.seconds }}
          APPTAINER_VERSION: ${{ steps.install-apptainer.outputs.version }}
          SIF_SECONDS: ${{ steps.sif.outputs.seconds }}
          APPTAINER_SECONDS: ${{ steps.apptainer-smoke.outputs.seconds }}
          ARTIFACT_URL: ${{ steps.upload-smoke-artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail

          {
            echo '## HEP smoke test'
            echo
            echo "- Platform: \`$PLATFORM\`"
            echo "- Apptainer: \`$APPTAINER_VERSION\`"
            echo "- [Plots, SAF, and diagnostics]($ARTIFACT_URL)"
            echo
            cat "$WORK_DIR/hep-env-smoke/summary.md"
            echo
            echo '| Timing | Seconds |'
            echo '| --- | ---: |'
            echo "| Docker physics smoke | $DOCKER_SECONDS |"
            echo "| Apptainer installation | $APPTAINER_INSTALL_SECONDS |"
            echo "| Docker image to SIF | $SIF_SECONDS |"
            echo "| Apptainer physics smoke | $APPTAINER_SECONDS |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.vars.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Add image environment Summary
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          output_file="$(mktemp)"

          docker run --rm \
            --platform "$PLATFORM" \
            -v "$PWD/scripts:/scripts:ro" \
            "$IMAGE@$DIGEST" \
            bash /scripts/print-env-versions.sh >"$output_file"

          {
            echo '## Image Environment Summary'
            echo
            echo "- Platform: \`$PLATFORM\`"
            echo "- Digest: \`$DIGEST\`"
            echo
            echo '```text'
            cat "$output_file"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-package
      # queue: max  # See: https://github.com/rhysd/actionlint/issues/657
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare variables
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # image: lowercased image reference (registry/repository).
          echo "image=$(echo "$REGISTRY/$IMAGE_NAME" \
            | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

          # ref_tag: Docker-tag-safe ref derived from ref_name.
          # NOTE: Different branch names can normalize to the same ref_tag
          # (for example, feature/foo and feature-foo).
          ref_name=$REF_NAME
          # 1) Normalize case and characters: lowercase and replace
          #    invalid chars with '-'.
          #    trim leading/trailing separators, and collapse repeated '-'.
          ref_tag="$(echo "$ref_name" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//; s/-{2,}/-/g')"
          # 2) Cap to Docker tag max length.
          ref_tag="${ref_tag:0:128}"
          # 3) Re-trim trailing separators after truncation.
          ref_tag="$(echo "$ref_tag" | sed -E 's/[.-]+$//')"
          # 4) Fallback when normalization results in an empty tag.
          if [[ -z "$ref_tag" ]]; then
            ref_tag="sha-${GITHUB_SHA::12}"
          fi
          echo "ref_tag=$ref_tag" >>"$GITHUB_OUTPUT"

          # with_latest: whether to also publish :latest.
          # Enabled only for tags matching ^v[0-9].
          if [[ "$ref_name" =~ ^v[0-9] ]]; then
            echo "with_latest=true" >>"$GITHUB_OUTPUT"
          else
            echo "with_latest=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest and tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          REF_TAG: ${{ steps.vars.outputs.ref_tag }}
          WITH_LATEST: ${{ steps.vars.outputs.with_latest }}
        run: |-
          set -euo pipefail
          shopt -s nullglob

          image=$IMAGE
          ref_tag=$REF_TAG
          with_latest=$WITH_LATEST

          # Build source image list from per-platform digest files.
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done

          # Guard against publishing an empty manifest when artifacts
          # are missing.
          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "::error::No digest files found in $(pwd)"
            ls -la
            exit 1
          fi

          # For Git tags: publish version tag, and optionally latest.
          # For branches: publish branch-derived tag only.
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            version="$ref_tag"
            target_tag="$version"

            if [[ "$with_latest" == 'true' ]]; then
              docker buildx imagetools create \
                -t "$image:$version" \
                -t "$image:latest" \
                "${sources[@]}"
            else
              docker buildx imagetools create \
                -t "$image:$version" \
                "${sources[@]}"
            fi
          else
            branch="$ref_tag"
            target_tag="$branch"
            docker buildx imagetools create \
              -t "$image:$branch" \
              "${sources[@]}"
          fi

          # Inspect the pushed manifest for a quick sanity check.
          docker buildx imagetools inspect "$image:$target_tag"
