name: Build and Publish Image

on:
  push:
  workflow_dispatch:

concurrency:
  group: >-
    ${{
      github.event.deleted
      && format('deleted-push-{0}', github.run_id)
      || format('{0}-{1}', github.ref_type, github.ref_name)
    }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare variables
        id: vars
        run: |
          set -euo pipefail

          # image: lowercased image reference (registry/repository).
          echo "image=$(echo "$REGISTRY/$IMAGE_NAME" \
            | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

          # platform_pair: artifact-safe platform key.
          # Example: linux/amd64 -> linux-amd64
          platform='${{ matrix.platform }}'
          echo "platform_pair=${platform//\//-}" >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.vars.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/digests"
          digest=$DIGEST
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest: $digest"
            exit 1
          fi
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.vars.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Add image environment Summary
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          output_file="$(mktemp)"

          docker run --rm \
            --platform "$PLATFORM" \
            -v "$PWD/scripts:/scripts:ro" \
            "$IMAGE@$DIGEST" \
            bash /scripts/print-env-versions.sh >"$output_file"

          {
            echo '## Image Environment Summary'
            echo
            echo "- Platform: \`$PLATFORM\`"
            echo "- Digest: \`$DIGEST\`"
            echo
            echo '```text'
            cat "$output_file"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-package
      # queue: max  # See: https://github.com/rhysd/actionlint/issues/657
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare variables
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # image: lowercased image reference (registry/repository).
          echo "image=$(echo "$REGISTRY/$IMAGE_NAME" \
            | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

          # ref_tag: Docker-tag-safe ref derived from ref_name.
          # NOTE: Different branch names can normalize to the same ref_tag
          # (for example, feature/foo and feature-foo).
          ref_name=$REF_NAME
          # 1) Normalize case and characters: lowercase and replace
          #    invalid chars with '-'.
          #    trim leading/trailing separators, and collapse repeated '-'.
          ref_tag="$(echo "$ref_name" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//; s/-{2,}/-/g')"
          # 2) Cap to Docker tag max length.
          ref_tag="${ref_tag:0:128}"
          # 3) Re-trim trailing separators after truncation.
          ref_tag="$(echo "$ref_tag" | sed -E 's/[.-]+$//')"
          # 4) Fallback when normalization results in an empty tag.
          if [[ -z "$ref_tag" ]]; then
            ref_tag="sha-${GITHUB_SHA::12}"
          fi
          echo "ref_tag=$ref_tag" >>"$GITHUB_OUTPUT"

          # with_latest: whether to also publish :latest.
          # Enabled only for tags matching ^v[0-9].
          if [[ "$ref_name" =~ ^v[0-9] ]]; then
            echo "with_latest=true" >>"$GITHUB_OUTPUT"
          else
            echo "with_latest=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest and tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          REF_TAG: ${{ steps.vars.outputs.ref_tag }}
          WITH_LATEST: ${{ steps.vars.outputs.with_latest }}
        run: |-
          set -euo pipefail
          shopt -s nullglob

          image=$IMAGE
          ref_tag=$REF_TAG
          with_latest=$WITH_LATEST

          # Build source image list from per-platform digest files.
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done

          # Guard against publishing an empty manifest when artifacts
          # are missing.
          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "::error::No digest files found in $(pwd)"
            ls -la
            exit 1
          fi

          # For Git tags: publish version tag, and optionally latest.
          # For branches: publish branch-derived tag only.
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            version="$ref_tag"
            target_tag="$version"

            if [[ "$with_latest" == 'true' ]]; then
              docker buildx imagetools create \
                -t "$image:$version" \
                -t "$image:latest" \
                "${sources[@]}"
            else
              docker buildx imagetools create \
                -t "$image:$version" \
                "${sources[@]}"
            fi
          else
            branch="$ref_tag"
            target_tag="$branch"
            docker buildx imagetools create \
              -t "$image:$branch" \
              "${sources[@]}"
          fi

          # Inspect the pushed manifest for a quick sanity check.
          docker buildx imagetools inspect "$image:$target_tag"
